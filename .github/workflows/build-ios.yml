name: Build WalkTrace iOS (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract complete SwiftUI source
        shell: bash
        run: |
          set -euo pipefail
          cat .source-parts/part*.b64 | base64 -D > "$RUNNER_TEMP/WalkTrace-source.tar.xz"
          tar -xJf "$RUNNER_TEMP/WalkTrace-source.tar.xz" -C "$GITHUB_WORKSPACE"
          test -f WalkTrace.xcodeproj/project.pbxproj
          test -f WalkTrace/WalkTraceApp.swift
          # The smaller transferred archive omits the optional app icon image.
          python3 - <<'PY'
          import json
          p = 'WalkTrace/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json'
          with open(p, encoding='utf-8') as f:
              data = json.load(f)
          for item in data['images']:
              item.pop('filename', None)
          with open(p, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

      - name: Publish editable project files to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WalkTrace WalkTrace.xcodeproj
          if ! git diff --cached --quiet; then
            git commit -m "Add full WalkTrace SwiftUI source files"
            git push
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project WalkTrace.xcodeproj \
            -scheme WalkTrace \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/WalkTraceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS= \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=WALKTRACE_SIDELOAD \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/WalkTraceDerivedData/Build/Products/Release-iphoneos/WalkTrace.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/dist"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/WalkTrace.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -q -r "$GITHUB_WORKSPACE/dist/WalkTrace-unsigned.ipa" Payload
          /usr/bin/unzip -t "$GITHUB_WORKSPACE/dist/WalkTrace-unsigned.ipa" >/dev/null

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: WalkTrace-unsigned-iPhone-app
          path: dist/WalkTrace-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
